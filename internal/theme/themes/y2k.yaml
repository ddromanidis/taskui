# y2k — the millennium, as a Taskfile.
#
# The reference is the 1999-2003 web and the plastic it was sold on: chrome silver as the
# structural colour, bubblegum pink and lilac as the accents, electric blue and lime for
# anything that needs to shout. Where the 90s theme is a DOS box and synthwave is the poster
# on the wall, this one is the translucent iMac the browser was running on.
#
# Chrome is doing the work that grey does in every other theme, which is the whole trick of
# the look: the era's silver was never neutral, it was a highlight and a shadow pretending to
# be a colour, and giving it the structural job is what stops the pinks reading as a novelty
# palette bolted onto something sensible.
#
# The two things it does that nothing else does:
#
# The selected row is a chrome button. `selection` is the cyber navy of a pressed control,
# `selection-light` is the polished top edge and `selection-shade` is the underside — the
# same bevel every widget in the era had, which is why it reads as something you could click
# rather than something that is merely highlighted.
#
# And it dips. Once every four seconds the whole row does one thing at once: the chrome edge
# reaches the bottom of its travel, the text leans a column right, and the bar deepens. It
# is a joke about animated GIF text and it is deliberately slow — at this rate you notice it
# when you stop to read, and not while you are moving through the list. The timing is in the
# `animation:` block at the bottom, three lines you can retime or delete.
extends: default

colors:
  # Bubblegum leads, lilac answers. The two colours every layout of the era put next to
  # each other on a chrome background.
  accent: "#ff69b4"
  mode: "#b8a1ff"

  # The chrome. `dim` is the polished face, `faint` and `rule` the shadow it sits in — a
  # gradient flattened into the two tones a terminal can actually hold.
  dim: "#c0c8d8"
  faint: "#5a6a8a"
  rule: "#8c9ab5"
  text: default

  # A pressed button: navy face, a polished top edge, a dark underside.
  selection: "#2e3192"
  selection-light: "#dfe8f5"
  selection-shade: "#161a52"
  # What the face turns on the blink's dark frames — deeper, not brighter.
  #
  # The bar has the row's text on it, and that text was picked to read against the terminal's
  # background rather than against a bar. Lightening the bar closes the gap on every one of
  # them at once: a brighter navy took the description from 6.3:1 to 4.0:1 and the accent to
  # 2.5:1, so the dip cost a frame of legibility three times a cycle. Going the other way
  # widens the gap instead, and the bar reads as receding toward its own underside rather
  # than flashing.
  selection-blink: "#1a1c4a"

  alias: "#87ceeb"
  danger: "#ff0090"

  # Lime for done, cyber yellow for busy, hot magenta for broken. The candy plastics.
  status-ok: "#60e000"
  status-running: "#ffd010"
  status-failed: "#ff0090"
  status-skipped: "#5a6a8a"
  status-pending: "#5a6a8a"

  command: "#0060ff"

  search: "#ff69b4"
  match-fg: "#161a52"
  match-bg: "#60e000"

  # A location is a link, and a link in 1999 was blue and underlined. It is still underlined.
  location: "#0060ff"

  diff-added: "#60e000"
  diff-removed: "#ff0090"

  notice: "#ffd010"
  stored: "#87ceeb"
  interactive: "#60e000"
  warning-fg: "#161a52"
  warning-bg: "#ffd010"
  confirm-fg: "#161a52"
  confirm-bg: "#ff0090"

# The theme that moves — once per cycle, with all of it moving together.
#
# Three sequences, all twelve frames long, so they share a period instead of drifting past
# each other. Read them stacked and you can see the shape: for the first six frames the row
# sits still while the chrome edge slides down its column. On frames six to eight it dips —
# the edge reaches the bottom, the text leans a column right, and the bar deepens to the
# darker navy of `selection-blink` — and then all three come back. One gesture, just under
# a second long, every four.
#
# Deliberately not three motions at three speeds. Sequences of different lengths never line
# up, which sounds like richness and reads like three unrelated things twitching at a row you
# are trying to read. Matching their lengths is what turns them into one movement.
#
# Every one of them is a separate line you can shorten, lengthen or delete, and the length is
# the speed — write more frames to slow it down. `interval-ms: 0` stops the lot without
# losing the colours.
animation:
  #                  ↓ the dip
  selection-frames: "▀▀▀███▄▄▄███"
  selection-jiggle: "000000111000"
  selection-blink: "111111000111"
  interval-ms: 320

glyphs:
  # Sparkles, because every page had them and half of them were animated.
  wordmark: "✧･ﾟ TASKUI ･ﾟ✧"
  separator: "›"
  dot: "•"

  # Hollow markers: the era's plastic was translucent, and so are its arrows.
  fold-open: "▽"
  fold-closed: "▷"
  fold-peek: "◇"

  # Rounded guides — the one corner radius this look allows itself, and it uses it on
  # everything.
  guide-branch: "├"
  guide-last: "╰"
  guide-vertical: "│"

  # The two faces of the chrome bevel.
  rail: "▐"
  selection-shade: "▌"

  # A rule of dots rather than a line: chrome does not do hairlines, it does dither.
  rule: "·"

  command: "›"
  warning: "◆"
  bar: "▓"

  diff-added: "+"
  diff-removed: "-"
  diff-gap: "◦"
  danger: "◆"
  cursor: "▓"

  status-ok: "◉"
  status-failed: "◈"
  status-running: "▷"
  status-pending: "◌"
  status-skipped: "◌"
