name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The README claims Linux works; this is what makes that a tested claim rather
      # than an assumption. The platform-specific parts — the pty, the process-group
      # signal used to stop a run, the clipboard — are exactly what differs.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Several tests spawn a real `task` process — cancelling a run, answering an
      # interactive prompt, proving stdin reaches the child. Without go-task on PATH
      # they do not fail meaningfully, they fail immediately.
      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - run: task --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  # The project's own Taskfile is the thing this tool exists to run, so running it is
  # a real test of both.
  dogfood:
    name: dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install go-task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - run: task all
      - name: Discovery works against a real Taskfile
        run: |
          cargo run --quiet -- --list | tail -1
          cargo run --quiet -- --dump verb | head -5
          cargo run --quiet -- --screenshot 100x20 > /dev/null
