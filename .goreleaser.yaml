# goreleaser config for taskui.
#
# Unix only, deliberately: the capture layer drives a real pty and signals process groups,
# which is the whole reason stopping a run reaps the shell commands underneath it. There is
# no Windows build because there is no Windows implementation of that, and shipping one
# that silently could not stop anything would be worse than not shipping one.
version: 2

project_name: taskui

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: taskui
    main: .
    binary: taskui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ddromanidis/taskui/cmd.version={{ .Version }}
      - -X github.com/ddromanidis/taskui/cmd.commit={{ .Commit }}
      - -X github.com/ddromanidis/taskui/cmd.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: taskui
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - EXAMPLES.md
      - LICENSE
      - taskui.1
      - config.high-contrast.yaml

# The tap. A Homebrew tap is just a GitHub repository called `homebrew-<something>`, and
# this writes the cask into it on every release — so `brew upgrade` is the same release the
# binaries above came from, rather than a second thing to remember to update.
#
# A cask rather than a formula because goreleaser deprecated `brews:` in 2.18 and Homebrew
# itself now wants prebuilt binaries in casks. The generated file carries `on_linux` URLs,
# but Homebrew installs casks on macOS only — Linux goes through `go install` or the
# archives above, which is where a Linux user was heading anyway.
#
# It needs a token with write access to the tap repo, which is not the one GitHub Actions
# hands you for this one: `GITHUB_TOKEN` is scoped to the repository the workflow runs in,
# and the tap is a different repository.
homebrew_casks:
  - name: taskui
    repository:
      owner: ddromanidis
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ddromanidis/taskui"
    description: "A folding, searchable front end for go-task"
    license: "MIT"
    manpages:
      - taskui.1
    # taskui is a front end for go-task, not a replacement: without it on PATH the first
    # thing it does is fail to find any tasks.
    dependencies:
      - formula: go-task
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "taskui {{ .Tag }}"
    hooks:
      post:
        # An unsigned binary downloaded by Homebrew still carries macOS's quarantine flag,
        # and Gatekeeper refuses it the first time you run it. Clearing it here is what the
        # `brew install` was for.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/taskui"]
          end
    caveats: |
      taskui needs go-task on your PATH, which came with this cask.

      Themes:  taskui --list-themes
      Keys:    ? inside taskui lists every binding.

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: ddromanidis
    name: taskui
  draft: false
  prerelease: auto
  footer: |
    ---
    Install with `go install github.com/ddromanidis/taskui@latest`, or take a binary above.

    taskui needs [go-task](https://taskfile.dev) on your PATH — it is a front end for it,
    not a replacement.
