# goreleaser config for taskui.
#
# Unix only, deliberately: the capture layer drives a real pty and signals process groups,
# which is the whole reason stopping a run reaps the shell commands underneath it. There is
# no Windows build because there is no Windows implementation of that, and shipping one
# that silently could not stop anything would be worse than not shipping one.
version: 2

project_name: taskui

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: taskui
    main: .
    binary: taskui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ddromanidis/taskui/cmd.version={{ .Version }}
      - -X github.com/ddromanidis/taskui/cmd.commit={{ .Commit }}
      - -X github.com/ddromanidis/taskui/cmd.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: taskui
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - EXAMPLES.md
      - LICENSE
      - taskui.1
      - config.high-contrast.yaml

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: ddromanidis
    name: taskui
  draft: false
  prerelease: auto
  footer: |
    ---
    Install with `go install github.com/ddromanidis/taskui@latest`, or take a binary above.

    taskui needs [go-task](https://taskfile.dev) on your PATH — it is a front end for it,
    not a replacement.
